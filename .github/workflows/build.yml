name: Build & Release

on:
  push:
    branches: [ main, master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashback-vulkan-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          retention-days: 14

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flashback VulkanMod Compat ${{ github.ref_name }}"
          body: |
            ## Flashback + VulkanMod Compatibility Build ${{ github.ref_name }}

            This build adds compatibility between Flashback mod and VulkanMod.

            ### Changes
            - Fixed pixel buffer download to use GPU abstraction layer instead of raw OpenGL PBO calls
            - Guarded `glGetInteger`/`_glBindFramebuffer` calls in `FramebufferUtils` to not crash under Vulkan
            - Added VulkanMod compat mixin (`MixinVulkanModRenderSystem`)
            - Export to video now works correctly when VulkanMod is installed

            ### Installation
            1. Install [Fabric Loader](https://fabricmc.net/)
            2. Install [VulkanMod](https://modrinth.com/mod/vulkanmod)
            3. Drop this jar into your `mods/` folder

            ### Requirements
            - Minecraft ${{ env.MC_VERSION || '1.21.11' }}
            - Fabric Loader ≥ 0.15.10
            - VulkanMod (optional, but now supported)
            - Java 21+
          files: |
            build/libs/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
